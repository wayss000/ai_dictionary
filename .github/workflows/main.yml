name: Build main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build macOS app
    runs-on: macos-latest

    steps:
      - name: Validate release input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Select main and enter a release version such as v1.0.0."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build macOS release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--build-name "${RELEASE_TAG#v}")
          fi
          flutter build macos --release "${args[@]}"

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/ai_dictionary.app \
            build/ai_dictionary-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dictionary-macos
          path: build/ai_dictionary-macos.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: ai-dictionary-macos

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --refs "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG"; then
            echo "::error::The tag $RELEASE_TAG already exists."
            exit 1
          else
            result=$?
            if [[ "$result" != 2 ]]; then exit "$result"; fi
          fi
          gh release create "$RELEASE_TAG" ai_dictionary-macos.zip \
            --target "$GITHUB_SHA" --title "AI Dictionary $RELEASE_TAG" --generate-notes
